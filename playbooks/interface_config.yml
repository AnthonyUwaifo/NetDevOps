---
- name: Interface Configurations
  hosts: all
  gather_facts: no
  vars_files:
  - ../group_vars/all/vault.yml

  tasks:
    - name: Configure Interfaces
      cisco.ios.ios_config:
        src: ../templates/interfaces.j2
      

    - name: Retrieve Interface Brief
      cisco.ios.ios_command:
        commands:
          - show ip int br
      register: int_br

    - name: Display Interface Brief
      debug:
        var: int_br.stdout_lines


