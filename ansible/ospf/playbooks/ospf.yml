---
- name: Configuring OSPF
  hosts: all
  gather_facts: no
  vars_files:
  - ../group_vars/all/vault.yml

  tasks:
    - name: Configure Interfaces
      cisco.ios.ios_config:
        src: ../templates/ospf.j2
      

    - name: Retrieve Interface Brief
      cisco.ios.ios_command:
        commands:
          - show ip int br
      register: int_br


    - name: Display Interface Brief
      debug:
        var: int_br.stdout_lines


    - name: Configure R1 OSPF Priority
      cisco.ios.ios_config:
        lines: 
          - ip ospf priority 150
        parents: interface GigabitEthernet0/1
      when: inventory_hostname == "R1"


    - name: Configure OSPF On R1
      cisco.ios.ios_config:
        src: ../templates/ospf.j2 
      when: inventory_hostname == "R1"       


    - name: Configure R2 OSPF Priority
      cisco.ios.ios_config:
        lines: 
          - ip ospf priority 100
        parents: interface GigabitEthernet0/1
      when: inventory_hostname == "R2"
    

    - name: Configure OSPF On R2
      cisco.ios.ios_config:
        src: ../templates/ospf.j2 
      when: inventory_hostname == "R2"      


    - name: Configure OSPF on R3-R5
      cisco.ios.ios_config:
        src: ../templates/ospf.j2
      
    - name: Wait for adjacency to complete
      pause:
        seconds: 40


    - name: Retrieve OSPF Adjacency
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
      register: ospf_neighbor


    - name: Display OSPF Adjacency
      debug:
        var: ospf_neighbor.stdout_lines
